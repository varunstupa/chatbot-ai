app:
  name: "RAG Backend"
  version: "1.0"

server:
  host: "0.0.0.0"
  port: 8001  # 8000 is the local API gateway

paths:
  upload_dir: "data/uploads"

# Re-upload / re-ingest docs after changing chunk_* so Chroma matches.
chunking:
  # multilingual-e5-base reads at most 512 tokens; 1500 characters with 150 overlap
  # stays inside the limit, so no part of a chunk is cut off during embedding.
  chunk_size: 1500
  chunk_overlap: 150

embedding:
  model_name: "intfloat/multilingual-e5-base"
  model_kwargs: {}
  encode_kwargs:
    normalize_embeddings: true
  # E5 models are trained with these prefixes; they are added to every text.
  query_prefix: "query: "
  passage_prefix: "passage: "

vector_store:
  collection_name: "rag_collection"
  persist_directory: "data/chroma_e5"
  top_k: 4

# Crawled pages (e.g. stupasports.ai) only — separate Chroma persist path.
website_vector_store:
  collection_name: "stupasports_website"
  persist_directory: "data/chroma_website_e5"
  top_k: 4

# Stupa web client: RAG corpus — website = crawled Chroma only.
# Strict: no matching chunks → "I don't know" (see also rag_pipeline early exit).
stupa_chat:
  rag_corpus: "website"
  prompt_template: |
    You answer for Stupa's public website chat. Obey ALL rules below.

    Grounding:
    - Use ONLY the Context below (retrieved website chunks). Do not use outside knowledge, training data, guesses, or inference beyond what is explicitly written there.
    - If the Context is empty, or no passage in the Context answers the Question (including partial or irrelevant matches), reply with exactly this single line and nothing else:
    I don't know
    - Do not hedge, apologize, or suggest contacting support unless that text appears in the Context.

    Conversation:
    - Prior messages may disambiguate the Question only; every factual claim must still be supported by the Context.

    When the Context clearly answers the Question, reply in concise Markdown (## headings, short paragraphs). No filler.

    Context:
    {context}

    Question:
    {question}

    Answer (Markdown, OR exactly "I don't know"):

demo_booking:
  send_email_url: "https://stupasports.ai/api/send-email"
  enabled: true

# Non-secret Jira fields (override in .env: JIRA_BASE_URL, JIRA_EMAIL, …)
jira:
  base_url: ""
  email: ""
  project_key: ""
  issue_type: "Bug"

rag:
  prompt_template: |
    You are a helpful assistant.
    Use the Context block below for facts from uploaded documents.
    For follow-ups about this chat (e.g. what the user said earlier, the previous question, or details they already gave like an event name), use the prior messages in the conversation.
    If the user names a topic, section, or heading that appears in the Context, summarize what the Context says about it.

    When you have enough information, give a direct answer and stop. Do not add caveats after a complete answer.

    Only if Context and prior conversation give no relevant information at all, reply with exactly this single line (and nothing else):
    I don't know

    Context:
    {context}

    Question:
    {question}

    Answer (≤150 words Markdown OR exactly "I don't know"):

# Admin-app chat (/app-chat): screen guides, one Chroma collection per tenant.
# Keys live in .env: APP_CHAT_JWT_SECRET (or APP_CHAT_JWT_PUBLIC_KEY) and
# KNOWLEDGE_SERVICE_KEY. See README "Admin-app chat".
auth:
  # Reached through the local API gateway (/chatbot/v1/*); see README.
  mode: "gateway"
  # The user-role service signs login tokens with RS256; verify with its public key.
  jwt_algorithms: ["RS256"]
  # Tenants this deployment answers for; a token for any other tenant is refused.
  allowed_tenants: ["staging"]
  tenant_claims: ["tenant", "tenant_code", "tenant_name"]
  user_claims: ["user_role_id", "user_id", "sub"]
  role_claims: ["role_name", "role_id"]

cors:
  allow_origins:
    - "http://localhost:4200"
    - "http://127.0.0.1:4200"
    - "http://localhost:4300"
    - "http://127.0.0.1:4300"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

app_chat:
  # One folder per embedding model (vectors of two models must never share a store).
  persist_directory: "data/chroma_kb_me5"
  collection_name: "knowledge_chunks"        # single collection for all tenants
  registry_file: "document_registry.json"    # per-document access, in persist_directory
  guides_directory: "guides"                 # guide Markdown, loaded at every start
  # Multilingual: questions in any language find the English guides.
  embedding_model: "intfloat/multilingual-e5-base"
  top_k: 3
  history_messages: 6
  # Chroma distance (lower is closer); hits above the limit count as no match.
  # Calibrated for multilingual-e5-base (right answers 0.32-0.51 in 7 languages).
  screen_max_distance: 0.55  # guide of the screen the user is on
  max_distance: 0.52         # guides of other screens
  screen_boost: 0.03         # lower distance for the current screen's guides
  topic_boost: 0.05          # lower distance for guides named in the question
  candidate_pool: 20         # passages from all guides ranked before the boosts
  # Hybrid search: keyword (BM25) matches join the semantic candidates, so exact screen
  # labels and message texts are found. Measured: top-1 41/47 -> 44/47 on the baseline.
  keyword_search: true
  keyword_pool: 10           # keyword matches added to the candidates
  keyword_boost: 0.03        # lower distance of the best keyword match (2nd: half, ...)
  # Cross-encoder rerank: off. mmarco-mMiniLMv2 lowered the baseline (47/47 -> 42/47) and
  # added ~0.7 s; bge-reranker-v2-m3 takes ~9 s on CPU. Re-test before turning it on.
  rerank: false
  rerank_model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
  # A question that finds nothing close is rewritten by the model as an English search
  # query and searched again (~1 s extra, only for those questions).
  rewrite_weak_questions: true
  rewrite_above: 0.47
  # "Did you mean": a question about the modules that gets no answer is offered the closest
  # suggested questions of the guides. A question outside the modules (checked by the
  # model, ~1 s, only for unanswered questions) keeps the plain no-answer message.
  suggest_count: 3           # 0 turns it off
  suggest_max_distance: 0.27
  chunk_size: 1500
  chunk_overlap: 150

llm:
  # Use "local" or "ollama" for Ollama → local_model_name must match `ollama list`.
  provider: "local"
  # Tested 2026-10-20 (16 questions x 2 runs per value): accuracy 0 -> 95.8%, 0.2 -> 92.7%,
  # 0.5 -> 95.8%, 0.8 -> 92.7% (1 answer = 3%, so no real gain), while answers to the same
  # question varied 0% / 30% / 54% / 60% and above 0 the model broke the NO_ANSWER rule more
  # often. Keep 0 for guide answers. The rewrite and topic check always run at 0 (get_utility_llm).
  temperature: 0
  system_message: |
    You must respond in strict Markdown format.

    Rules:
    - Use ## for headings (not #)
    - Use proper Markdown tables
    - Use ``` for code blocks (always close them)
    - Do not output partial or broken Markdown
    - Do not switch formats mid-response
    - After you finish answering, stop. Do not append "I don't know" or similar if you already answered.
  local_base_url: "http://localhost:11434"
  local_model_name: "qwen3.5:4b-q4_K_M"
  # Thinking off: on CPU a thinking answer takes minutes. See LLMConfig.local_reasoning.
  local_reasoning: false
  local_keep_alive: "30m"

# Admin-chat questions and answers, per tenant and session (app/services/chat_store.py).
# Local MongoDB: mongod --dbpath <folder> --bind_ip 127.0.0.1 (see README).
# CHAT_STORE_MONGODB_URI in .env overrides mongodb_uri.
chat_store:
  enabled: true
  mongodb_uri: "mongodb://127.0.0.1:27017"
  database: "stupa_chatbot"
  retention_days: 180
logging:
  level: "INFO"
  json_format: false

messages:
  upload_success: "File ingested successfully"
  missing_filename: "Missing filename"
  upload_empty: "Empty upload"
  query_empty: "Question must not be empty"
  query_processing_failed: "Query processing failed"
  ticket_jira_not_configured: >-
    Ticket creation is not configured on the server.
    Please contact your administrator.
  ticket_create_failed: "Unable to create ticket. Please try again."
  ticket_session_lost: >-
    This ticket draft expired or was interrupted.
    Say **report an issue** to start again.
